name: Publish GHCR

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jwg054000/rustpipe

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/jwg054000/RustPipe
            org.opencontainers.image.description=Fast downstream RNA-seq analysis in Rust
            org.opencontainers.image.licenses=GPL-3.0
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=0.1.0,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Record digest
        run: |
          {
            echo "## rustpipe GHCR digest"
            echo ""
            echo '```'
            echo "${IMAGE}:0.1.0@${{ steps.build.outputs.digest }}"
            echo '```'
            echo ""
            echo "Pin that string in prairie-rna-stream \`nextflow.config\` (RUSTPIPE and CONVERT_PARQUET) and \`modules/packet.nf\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
